<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="smrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Dark Background Squircle -->
  <rect width="100" height="100" rx="24" fill="#090D16" />
  <rect x="2" y="2" width="96" height="96" rx="22" stroke="url(#smrGrad)" stroke-width="2" stroke-opacity="0.4" />

  <!-- Map Pin & Digital Network Shape -->
  <path d="M50 16 C35.6 16 24 27.6 24 42 C24 58.5 45.2 78.4 48.6 81.5 C49.4 82.2 50.6 82.2 51.4 81.5 C54.8 78.4 76 58.5 76 42 C76 27.6 64.4 16 50 16 Z" fill="url(#smrGrad)" filter="url(#glow)" fill-opacity="0.2" stroke="url(#smrGrad)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Inner Dynamic Ring / Web Orbit -->
  <circle cx="50" cy="40" r="14" fill="#090D16" stroke="#22C55E" stroke-width="3.5" />
  <circle cx="50" cy="40" r="6" fill="#38BDF8" />

  <!-- Signal Pulse Waves -->
  <path d="M68 28 C74 34 74 46 68 52" stroke="#22C55E" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8"/>
  <path d="M32 28 C26 34 26 46 32 52" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8"/>
</svg>
